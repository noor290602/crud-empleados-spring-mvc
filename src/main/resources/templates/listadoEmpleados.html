<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listado Empleados</title>
    <link rel="icon" type="image/jpeg" th:href="@{/images/empleados.jpg}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

    <style type="text/css">
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Inter", sans-serif;    
    }

    table, th, td {
        border: 1px solid;
        border-collapse: collapse;
        padding: 20px 50px;
    }

    h1 {
        color: white;
        text-align: center;
        font-weight: bolder;
    }

    th {
        background-color: rgb(249, 154, 170);
        color: white;
        border: solid black 1px;
        font-weight: bold;
    }

    .sin-estilo, table {
        border-width: 0 !important;
        background-color: transparent;
        padding: 20px;
    }

    #titulo {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 1em;
        width: 100%;
        padding: 20px 10px;
        background-color: pink;
        margin-bottom: 1em;
    }

    #titulo p {
        font-size: 2em;
    }

    .texto-bold {
        font-weight: bold;
        background-color: rgb(253, 230, 234);
    }

    body {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 2em;
    }

    a {
        text-decoration: none;
    }

    .iconos-button {
        display: flex;
        justify-content: center;
        align-items: center;
        border-radius: 8px;
        color: black;
        padding: 10px 10px;
        border: 1px solid rgb(249, 154, 170);

        a {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: black;
        }

        &:hover {
            background-color: rgb(249, 154, 170);
            color: white;
            cursor: pointer;

            a span {
                color: white;
            }
        }
    }

    .iconos-button:hover img {
        /* Este filtro convierte casi cualquier color en blanco puro */
        filter: brightness(0) invert(1); 
    }
    
</style>
</head>

<!-- Hay solo 1 frontcontroller, pero controladores todos los que se necesiten, uno por cada entidad que le quieras dar mantenimiento (CRUD)-->

<body>
    <div id="titulo">
        <p>💼</p>
        <h1>Listado de empleados</h1>
        <p>💼</p>
    </div>

    <div class="iconos-button">
        <a th:href="@{/empleados/add}">
            <img th:src="@{/images/svg/add.svg}" alt="Icono añadir empleado">
            <span>Añadir empleado</span>
        </a>
    </div>
   
    <div>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Apellidos</th>
                    <th>Salario</th>
                    <th class="sin-estilo"></th>
                    <th class="sin-estilo"></th>
                    <th class="sin-estilo"></th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="empleado : ${empleados}">
                    <td th:text="${empleado.id}" class="texto-bold"></td>
                    <td th:text="${empleado.nombre}"></td>
                    <td th:text="${empleado.primerApellido + ' ' + empleado.segundoApellido}"></td>
                    <td th:text="${empleado.salario}"></td>
                    <td class="sin-estilo">
                        <div class="iconos-button">
                            <a th:href="@{'/empleados/view/' + ${empleado.id}}">
                                <img th:src="@{/images/svg/visibility.svg}" alt="Icono ver">
                            </a>
                        </div>
                    </td>
                    <td class="sin-estilo">
                        <div class="iconos-button">
                            <!-- El '@' en thymleaf evalua la URL o endpoint que que recibita la peticion
                             al hacer click en el enlace hipertexto -->
                            <a th:href="@{'/empleados/add/' + ${empleado.id}}">
                                <img th:src="@{/images/svg/edit.svg}" alt="Icono editar">
                            </a>
                        </div>
                    </td>
                    <td class="sin-estilo">
                        <div class="iconos-button">
                            <a th:href="@{'/empleados/delete/' + ${empleado.id}}">
                                <img th:src="@{/images/svg/delete.svg}" alt="Icono eliminar">
                            </a>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>

</html>
