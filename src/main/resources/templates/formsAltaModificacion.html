<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alta empleado</title>
    <link rel="icon" type="image/jpeg" th:href="@{/images/empleados.jpg}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

    <style type="text/css">
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Inter", sans-serif;    
    }

    h1 {
        color: white;
        text-align: center;
        font-weight: bolder;
    }

    #titulo {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 1em;
        width: 100%;
        padding: 20px 10px;
        background-color: pink;
        margin-bottom: 1em;
    }

    #titulo p {
        font-size: 2em;
    }

    .texto-bold {
        font-weight: bold;
        background-color: rgb(253, 230, 234);
    }

    body {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 1em;
    }

    a {
        text-decoration: none;
    }

    .iconos-button {
        display: flex;
        justify-content: start;
        align-items: center;
        border-radius: 8px;
        color: black;
        padding: 10px 10px;
        border: 1px solid rgb(249, 154, 170);
        width: fit-content;

        a {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: black;
        }

        &:hover {
            background-color: rgb(249, 154, 170);
            color: white;
            cursor: pointer;

            a span {
                color: white;
            }
        }
    }

    .iconos-button:hover img {
        filter: brightness(0) invert(1); 
    }

    fieldset {
        border-radius: 8px;
        border: 1px solid pink;
        padding: 10px;
        margin-bottom: 10px;
    }

    form {
        padding: 1em;
        border-radius: 24px;
        border: 1px solid pink;
        width: 60%;

        label {
            margin-right: 10px;
        }
    
        div {
            margin-bottom: 15px;
        }
    }

    .btnSubmit {
        display: flex;
        justify-content: center;
        align-items: center;
        margin-top: 2em;

        button {
            background-color: pink;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;

            &:hover {
                background-color: rgb(249, 154, 170);
                color: white;
            }
        }
    }

    input, select {
        padding: 5px;
        border-radius: 8px;
        border: 1px solid #ccc;
    }
</style>
</head>
<body>
     <div id="titulo">
        <p>💼</p>
        <h1>Alta/Modificación de empleados</h1>
        <p>💼</p>
    </div>
     <div style="width: 100%; padding: 0% 20%;">
        <div class="iconos-button">
            <a th:href="@{/empleados/listar}">
                <img th:src="@{/images/svg/volver.svg}" alt="Icono añadir empleado">
                <span>Volver a la lista de empleados</span>
            </a>
        </div>
    </div>
    <form th:action="@{/empleados/guardar}" th:object="${empleado}" method="post">
        <input type="hidden" th:field="*{id}">
        <div>
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" th:field="*{nombre}" required>
        </div>
        <div>
            <label for="primerApellido">Primer apellido:</label>
            <input type="text" id="primerApellido" th:field="*{primerApellido}" required>
        </div>
         <div>
            <label for="segundoApellido">Segundo apellido:</label>
            <input type="text" id="segundoApellido" th:field="*{segundoApellido}" required>
        </div>
         <div>
            <fieldset>
                <legend>Genero:</legend>
                <input type="radio" id="hombre" th:field="*{genero}" value="HOMBRE">
                <label for="hombre">Hombre</label><br>
                <input type="radio" id="mujer" th:field="*{genero}" value="MUJER">
                <label for="mujer">Mujer</label><br>
                <input type="radio" id="otro" th:field="*{genero}" value="OTRO">
                <label for="otro">Otro</label>
            </fieldset>
        </div>
        <div>
            <label for="fechaAlta">Fecha alta:</label>
            <input type="date" name="fechaAlta" id="fechaAlta" th:field="*{fechaInicio}" required>
        </div>
        <div>
            <label for="salario">Salario:</label>
            <input type="number" id="salario" th:field="*{salario}" required>
        </div>
        <div>
            <label for="departamentos">Departamentos:</label>
            <select id="departamentos" th:field="*{departamento}">
                <option value="" selected>Seleccione una opción...</option>
                <option th:each="dpto : ${departamentos}" 
                        th:value="${dpto.id}" 
                        th:text="${dpto.nombre}"
                        >
                </option>
            </select>
        </div>
        <div>
            <label for="telefonos">Telefono(s): </label>
            <input type="text" id="telefonos" name="telefonosEmpleado" placeholder="Separe los teléfonos por ';'" th:value="${numsTelefono}" size="50" required>
        </div>
        <div>
            <label for="emails">Email(s): </label>
            <input type="text" id="emails" name="emailsEmpleado" placeholder="Separe los emails por ';'" th:value="${dirsCorreo}" size="50" required>
        </div>
        <div class="btnSubmit">
            <button type="submit">Guardar</button>
        </div>
    </form>
</body>
</html>
