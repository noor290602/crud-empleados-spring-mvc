<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle empleado</title>
    <!-- Simulación de recurso estático para el icono (sustituye por la ruta correcta en tu entorno) -->
    <link rel="icon" type="image/jpeg" href="via.placeholder.com">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="fonts.googleapis.com" rel="stylesheet">

    <style type="text/css">
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Inter", sans-serif;
        }

        h1 {
            color: white;
            text-align: center;
            font-weight: bolder;
        }

        #titulo {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1em;
            width: 100%;
            padding: 20px 10px;
            background-color: pink;
            margin-bottom: 1em;
        }

        #titulo p {
            font-size: 2em;
        }

        .texto-bold {
            font-weight: bold;
            background-color: rgb(253, 230, 234);
            padding: 5px;
            border-radius: 4px;
            display: inline-block;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 1em;
        }

        a {
            text-decoration: none;
        }

        .iconos-button {
            display: flex;
            justify-content: start;
            align-items: center;
            border-radius: 8px;
            color: black;
            padding: 10px 10px;
            border: 1px solid rgb(249, 154, 170);
            width: fit-content;
        }

        .iconos-button a {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: black;
        }

        .iconos-button:hover {
            background-color: rgb(249, 154, 170);
            color: white;
            cursor: pointer;
        }

        .iconos-button:hover a span {
            color: white;
        }

        .iconos-button:hover img {
            filter: brightness(0) invert(1);
        }

        fieldset {
            border-radius: 8px;
            border: 1px solid pink;
            padding: 10px;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .info-container {
            padding: 2em;
            border-radius: 24px;
            border: 2px solid pink;
            width: 60%;
        }

        .info-container div {
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        label {
            font-weight: normal;
        }
    </style>
</head>

<body>
    <div id="titulo">
        <p>💼</p>
        <h1
            th:text="${'Detalles del empleado: ' + empleado.nombre + ' ' + empleado.primerApellido + ' ' + empleado.segundoApellido}">
        </h1>
        <p>💼</p>
    </div>
    <div style="width: 100%; padding: 0% 20%;">
        <div class="iconos-button">
            <a href="/empleados/listar">
                <img th:src="@{/images/svg/volver.svg}" alt="Icono añadir empleado">
                <span>Volver a la lista de empleados</span>
            </a>
        </div>
    </div>

    <div class="info-container">
        <div>
            <label>ID de empleado:</label>
            <span class="texto-bold" th:text="${empleado.id}"></span>
        </div>
        <div>
            <label for="nombre">Nombre:</label>
            <span class="texto-bold" th:text="${empleado.nombre}"></span>
        </div>
        <div>
            <label for="primerApellido">Primer apellido:</label>
            <span class="texto-bold" th:text="${empleado.primerApellido}"></span>
        </div>
        <div>
            <label for="segundoApellido">Segundo apellido:</label>
            <span class="texto-bold" th:text="${empleado.segundoApellido}"></span>
        </div>
        <div>
            <fieldset>
                <legend>Genero:</legend>
                <span class="texto-bold" th:text="${empleado.genero}"></span>
            </fieldset>
        </div>
        <div>
            <label for="fechaAlta">Fecha alta:</label>
            <span class="texto-bold" th:text="${empleado.fechaInicio}"></span>
        </div>
        <div>
            <label for="salario">Salario:</label>
            <span class="texto-bold" th:text="${empleado.salario}"></span>
        </div>
        <div>
            <label for="departamentos">Departamento:</label>
            <span class="texto-bold" th:text="${empleado.departamento.nombre}"></span>
        </div>
        <div>
            <label for="telefonos">Telefono(s): </label>
            <span class="texto-bold">
                <ul>
                    <li th:each="tel : ${numeroTelefonos}" th:text="${tel}"></li>
                </ul>
            </span>
        </div>
        <div>
            <label for="emails">Email(s): </label>
            <span class="texto-bold">
                <ul>
                    <li th:each="correo : ${direccionesCorreo}" th:text="${correo}"></li>
                </ul>
            </span>
        </div>
    </div>
</body>

</html>
