# ===============================
# = JPA / HIBERNATE
# ===============================

# Configuracion para Hibernate (ORM) (Object Relational Mapping) 
# Es un componente que permite hacer consultas a las entidades
# Las entidades son las clases de Java, con la anotación "@Entity"
# que estan mapeadas o relacionadas con las tablas de la base de datos.
# Hibernate traduce las consultas a las entidades, a consultas SQL
# que envia al motor (engine) de base de datos.

# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# dml + ddl (sentencias de crear objetos en SQL: tablas, procedures, vistas)
# create-drop -> se crean las tablas en BBDD y se borran cuando el server de Tomcat se inicia y se cierra
spring.jpa.hibernate.ddl-auto=create-drop 
spring.jpa.show-sql=true

# Para subir una imagen al servidor web (Apache Tomcat),
# hay que especificar el tamaño de cada trozo (chunk), porque el archivo se sube en partes, no 
# todo de una sola vez, y tambien hay que especificar el tamaño total que puede tener un archivo
# para ser subido al servidor

spring.servlet.multipart.max-file-size=10MB

spring.servlet.multipart.max-request-size=10MB

#maxima cantidad de partes por peticion
server.tomcat.max-part-count=30 